<article class="loginPage">
  <header class="loginHeader">
    <h1>Login</h1>
    <!-- <p>Sign in to your FS Motorshop account.</p> -->
  </header>

  <form id="loginForm" class="loginForm">
    <fieldset class="formGroup">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
    </fieldset>

    <fieldset class="formGroup">
      <label for="password">Password</label>
      <span class="passwordInput">
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" id="togglePassword">Show</button>
      </span>
    </fieldset>

    <!-- <section class="formOptions">
      <label><input type="checkbox" name="remember"> Remember me</label>
    </section> -->

    <button type="submit" class="loginButton">Login</button>
    <p id="loginError" class="formError" role="alart"></p>
  </form>

</article>
