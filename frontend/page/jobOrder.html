
<section class="jobOrdersPage" aria-labelledby="jobOrdersTitle">
  <header class="pageHeader">
    <div class="pageHeaderContent">
      <h1 id="jobOrdersTitle">Job Orders</h1>
      <p>Manage motorcycle repair and maintenance orders.</p>
    </div>

    <button
      class="primaryButton"
      type="button"
      id="createJobOrderButton"
    >
      Create
    </button>
  </header>

  <section class="jobOrdersSection" aria-labelledby="jobOrdersListTitle">
    <header class="sectionHeader">
      <h2 id="jobOrdersListTitle">All Job Orders</h2>
    </header>

    <div class="jobOrdersList" id="jobOrdersTableBody">
      <!-- Job order cards will be rendered here by JavaScript. -->
    </div>
  </section>
</section>



<dialog class="jobOrderModal" id="jobOrderModal">
  <form class="jobOrderForm" id="jobOrderForm">
    <header class="modalHeader">
      <h2>CREATE JOB ORDER</h2>

      <button
        class="modalCloseButton"
        type="button"
        id="closeJobOrderModal"
        aria-label="Close modal"
      >
        &times;
      </button>
    </header>

    <div class="modalBody">
      <!-- JOB ORDER -->
      <section class="formSection" aria-labelledby="jobOrderInformationTitle">
        <header class="sectionHeader">
          <h3 id="jobOrderInformationTitle">
            1. JOB ORDER
          </h3>
        </header>

        <div class="formGrid">
          <div class="formGroup">
            <label for="customerName">Customer</label>
            <input
              type="text"
              id="customerName"
              name="customerName"
              placeholder="Enter customer name"
              required
            >
          </div>

          <div class="formGroup">
            <label for="motorcycleName">Motorcycle</label>
            <input
              type="text"
              id="motorcycleName"
              name="motorcycleName"
              placeholder="Enter motorcycle name"
              required
            >
          </div>

          <div class="formGroup">
            <label for="customerContactNumber">Contact Number</label>
            <input
              type="text"
              id="customerContactNumber"
              name="customerContactNumber"
              placeholder="Enter contact number"
              required
            >
          </div>

          <div class="formGroup">
            <label for="motorcycleModel">Model</label>
            <input
              type="text"
              id="motorcycleModel"
              name="motorcycleModel"
              placeholder="Enter motorcycle model (optional)"
            >
          </div>

          <div class="formGroup">
            <label for="repairDate">Repair Date</label>
            <input
              type="datetime-local"
              id="repairDate"
              name="repairDate"
              required
            >
          </div>

          <div class="formGroup">
            <label for="repairStatus">Repair Status</label>
            <select
              id="repairStatus"
              name="repairStatus"
              required
            >
              <option value="pending" selected>Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>

          <div class="formGroup formGroupFull">
            <label for="description">Reported Problem</label>
            <textarea
              id="description"
              name="description"
              rows="4"
              placeholder="Describe the customer's reported problem... (optional)"
              required
            ></textarea>
          </div>
        </div>
      </section>

      <!-- SERVICE -->
      <section class="formSection" aria-labelledby="serviceInformationTitle">
        <header class="sectionHeader">
          <h3 id="serviceInformationTitle">
            2. SERVICE
          </h3>
        </header>

        <div class="formGrid">
          <div class="formGroup">
            <label for="serviceType">Service Type</label>
            <input
              type="text"
              id="serviceType"
              name="serviceType"
              placeholder="Service Type"
              required
            >
          </div>

          <div class="formGroup">
            <label for="laborCharge">Labor Charge</label>
            <input
              type="number"
              id="laborCharge"
              name="laborCharge"
              min="0"
              step="0.01"
              placeholder="0.00"
              required
            >
          </div>

          <div class="formGroup formGroupFull">
            <label for="serviceDescription">Service Description</label>
            <textarea
              id="serviceDescription"
              name="serviceDescription"
              rows="4"
              placeholder="Describe the service to be performed... (optional)"
              required
            ></textarea>
          </div>
        </div>
      </section>

      <!-- PARTS -->
      <section class="formSection" aria-labelledby="partsInventoryTitle">
        <header class="sectionHeader">
          <h3 id="partsInventoryTitle">3. PARTS AND INVENTORY</h3>
        </header>

        <div class="jobOrderItemsContainer">
          <div class="jobOrderItemsHeader">
            <span>Part</span>
            <span>Quantity</span>
            <span>Unit Price</span>
            <span>Action</span>
          </div>

          <div id="jobOrderItemsTableBody" class="jobOrderItemsList"></div>

          <template id="jobOrderItemTemplate">
            <div class="jobOrderItemRow">
              <div>
                <select
                  class="jobOrderItemInventory"
                  name="inventoryItemId[]"
                  required
                >
                  <option value="" selected disabled>
                    Select Part
                  </option>
                </select>
              </div>

              <div>
                <input
                  class="jobOrderItemQuantity"
                  type="number"
                  name="quantityUsed[]"
                  min="1"
                  step="1"
                  value="1"
                  required
                >
              </div>

              <div>
                <input
                  class="jobOrderItemUnitPrice"
                  type="number"
                  name="unitPrice[]"
                  min="0"
                  step="0.01"
                  placeholder="0.00"
                  required
                >
              </div>

              <div>
                <button
                  class="dangerButton removeJobOrderItemButton"
                  type="button"
                >
                  Remove
                </button>
              </div>
            </div>
          </template>

          <div class="jobOrderItemsActions">
            <button
              class="secondaryButton"
              type="button"
              id="addJobOrderItemButton"
            >
              + Add Part
            </button>
          </div>
        </div>
      </section>
    </div>

    <footer class="modalFooter">
      <button
        class="secondaryButton"
        type="button"
        id="cancelJobOrderButton"
      >
        Cancel
      </button>

      <button
        id="submitJobOrderButton"
        class="primaryButton"
        type="submit"
      >
        Create
      </button>
    </footer>
  </form>
</dialog>
