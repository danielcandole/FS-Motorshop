
<section class="jobOrdersPage" aria-labelledby="jobOrdersTitle">
  <header class="pageHeader">
    <div class="pageHeaderContent">
      <h1 id="jobOrdersTitle">Job Orders</h1>
      <p>Manage motorcycle repair and maintenance orders.</p>
    </div>

    <button
      class="primaryButton"
      type="button"
      id="createJobOrderButton"
    >
      Create
    </button>
  </header>

  <section class="jobOrdersSection" aria-labelledby="jobOrdersListTitle">
    <header class="sectionHeader">
      <h2 id="jobOrdersListTitle">All Job Orders</h2>
    </header>

    <div class="tableContainer">
      <table class="jobOrdersTableHeader">
        <thead>
          <tr>
            <th scope="col">Customer Name</th>
            <th scope="col">Contact Number</th>
            <th scope="col">Motorcycle Name</th>
            <th scope="col">Motorcycle Model</th>
            <th scope="col">Repair Date</th>
            <th scope="col">Description</th>
            <th scope="col">Repair Status</th>
          </tr>
        </thead>

        <tbody id="jobOrdersTableBody">

        </tbody>
      </table>
    </div>
  </section>
</section>



<dialog class="jobOrderModal" id="jobOrderModal">
  <form class="jobOrderForm" id="jobOrderForm">
    <div class="formPadding">
      <header class="modalHeader">
        <div>
          <h2>Create Job Order</h2>
          <p>Enter the customer and motorcycle details.</p>
        </div>
  
        <button
          class="modalCloseButton"
          type="button"
          id="closeJobOrderModal"
          aria-label="Close modal"
        >
          &times;
        </button>
      </header>
      
      <div class="modalBody">
        <div class="formGroup">
          <label for="customerName">Customer Name</label>
          <input
            type="text"
            id="customerName"
            name="customerName"
            placeholder="Enter customer name"
            required
          >
        </div>
  
        <div class="formGroup">
          <label for="customerContactNumber">Contact Number</label>
          <input
            type="text"
            id="customerContactNumber"
            name="customerContactNumber"
            placeholder="Enter customer contact number"
            required
          >
        </div>
  
        <div class="formGroup">
          <label for="motorcycleName">Motorcycle Name</label>
          <input
            type="text"
            id="motorcycleName"
            name="motorcycleName"
            placeholder="Enter motorcycle name"
            required
          >
        </div>
  
        <div class="formGroup">
          <label for="motorcycleModel">
            Motorcycle Model
          </label>
          <input
            type="text"
            id="motorcycleModel"
            name="motorcycleModel"
            placeholder="Enter motorcycle model (Optional)"
          >
        </div>
  
        <div class="formGroup">
          <label for="repairDate">Repair Date</label>
          <input
            type="datetime-local"
            id="repairDate"
            name="repairDate"
            required
          >
        </div>
  
        <div class="formGroup">
          <label for="description">
            Description
          </label>
          <textarea
            id="description"
            name="description"
            rows="4"
            placeholder="Describe the reported motorcycle problem... (Optional)"
          ></textarea>
        </div>
  
        <div class="formGroup">
          <label for="repairStatus">Repair Status</label>
          <select
            id="repairStatus"
            name="repairStatus"
            required
          >
            <option value="pending" selected>Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="done">Done</option>
          </select>
        </div>
      </div>
  
      <footer class="modalFooter">
        <button
          class="secondaryButton"
          type="button"
          id="cancelJobOrderButton"
        >
          Cancel
        </button>
  
        <button
          id="submitJobOrderButton"
          class="primaryButton"
          type="submit"
        >
          Create
        </button>
      </footer>
    </div>
  </form>
</dialog>
